<!DOCTYPE html>
<!--Start of getting tools-->
<head>
  <link rel="stylesheet" href="style.css">
  <!-- Recommended setup for 2026 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
</head>
<!--End of getting tools-->
 <body class="body">
   <main class="container">
     <!--Start of intro-->
     <section class="intro-container">
       <h1>Piano</h1>
       <div class="bottom-container">
  <select name="songs" id="songs" class="styled-dropdown">
    <option value="freeplay">Freeplay</option>
    <option value="mary_had_a_little_lamb.csv">Mary Had a Little Lamb</option>
    <option value="old_mcdonald.csv">Old McDonald</option>
    <option value="twinkle_twinkle_little_star.csv">Twinkle Twinkle Little Star</option>
  </select>
  <button id="play-stop-button" class="play-stop-button">Play/Stop</button>
</div>
     </section>
     <!-- End of intro-->
     <!--Start of piano-->
     <section class="piano-container" aria-label="Piano Keyboard">
       <ul class="piano-keys-list">
         <li class="piano-keys" role="button" tabindex="0" data-note="1" aria-label="A1"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="2" aria-label="A1#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="3" aria-label="B1"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="4" aria-label="C1"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="5" aria-label="C1#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="6" aria-label="D1"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="7" aria-label="D#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="8" aria-label="E1"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="9" aria-label="F1"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="10" aria-label="F#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="11" aria-label="G"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="12" aria-label="G#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="13" aria-label="A2"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="14" aria-label="A2#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="15" aria-label="B2"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="16" aria-label="C2"></li>
         <li class="piano-black-keys" role="button" tabindex="0" data-note="17" aria-label="C2#"></li>
         <li class="piano-keys" role="button" tabindex="0" data-note="18" aria-label="D2"></li>
       </ul>
     </section>
     </main>
     <script src="script.js"></script>
 </body>
